{% extends "base.html" %}
{% load static %}

{% block title %}Donaciones - Refugio Dhermes{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página no encontrada">
    <title>404 - Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-home {
        display: inline-block;
        padding: 15px 30px; /* Aumenta el tamaño del botón */
        font-size: 1.5rem; /* Texto más grande */
        font-weight: bold; /* Texto en negrita */
        border-radius: 8px; /* Bordes redondeados */
        background-color: cadetblue; /* Verde llamativo */
        color: white; /* Texto en blanco */
        text-decoration: none; /* Sin subrayado */
        transition: all 0.3s ease; /* Transición suave */
}

/* Efecto al pasar el mouse */
.btn-home:hover {
    background-color:blue; /* Verde más oscuro al pasar el mouse */
    transform: scale(1.1); /* Agrandamiento sutil */
}
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">¡Oops! La página que buscas no existe.</div>
        <a href="/" class="btn-home">Volver al inicio</a>
    </div>
</body>
</html>
{% endblock %}
